name: uses-fixture
on: [push]
jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: make-artifact
        run: printf 'artifact-body\n' > "$RUNNER_TEMP/art.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: my-artifact
          path: ${{ runner.temp }}/art.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/.buildx-cache
          key: unit
      # fictional vendor + SHA-pinned (never fetched; the runner dispatches
      # on the base name only) — pins the unknown-action SKIP path
      - uses: some-vendor/unknown-action@1111111111111111111111111111111111111111
