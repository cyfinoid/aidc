name: env-fixture
on: [push]
env:
  WF_V: from-workflow
jobs:
  layered:
    runs-on: ubuntu-latest
    env:
      JOB_V: from-job
    steps:
      - name: setup-state
        env:
          STEP_V: from-step
        run: |
          echo "wf=$WF_V job=$JOB_V step=$STEP_V" > "$RUNNER_TEMP/env-seen"
          echo "GENV_LATER=42" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/fakebin"
          printf '#!/usr/bin/env bash\necho fake-tool-ran\n' > "$RUNNER_TEMP/fakebin/fake-tool"
          chmod +x "$RUNNER_TEMP/fakebin/fake-tool"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
      - name: consume-state
        run: |
          echo "genv=$GENV_LATER" >> "$RUNNER_TEMP/env-seen"
          fake-tool > "$RUNNER_TEMP/tool-seen"
