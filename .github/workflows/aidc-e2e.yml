name: aidc-e2e

# End-to-end smoke tests for the host-side aidc CLI across both supported
# host platforms. These cover the Docker-free code paths (install, Claude
# profile alias syncing, profile listing, toolchain detection) plus the full
# `aidc init` scaffold where a Docker CLI is available.
#
# The macOS leg deliberately runs under the system bash 3.2 (see the PATH
# shim below). macOS ships bash 3.2.57, where "${arr[@]}" on an *empty* array
# is an "unbound variable" error under `set -u` — the exact failure mode this
# suite regression-tests. GitHub's macOS image otherwise resolves a newer
# Homebrew bash first on PATH, which would silently skip that path.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: aidc-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Make `#!/usr/bin/env bash` resolve to the system bash 3.2 on macOS so
      # the install/sync paths are exercised under the interpreter real macOS
      # users have. Prepending a shim dir that contains only `bash` avoids
      # shadowing any other tool. No-op on Linux (already bash 5.x).
      - name: Pin macOS to system bash 3.2
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          shim="$RUNNER_TEMP/bash32"
          mkdir -p "$shim"
          ln -sf /bin/bash "$shim/bash"
          echo "$shim" >> "$GITHUB_PATH"

      - name: Show + verify bash version
        run: |
          set -euo pipefail
          echo "bash on PATH:    $(command -v bash)"
          bash --version | head -1
          echo "env bash:        $(env bash -c 'echo $BASH_VERSION')"
          if [ "${{ runner.os }}" = "macOS" ]; then
            ver="$(env bash -c 'echo $BASH_VERSION')"
            case "$ver" in
              3.2*) echo "macOS is running the system bash 3.2 as intended ($ver)";;
              *) echo "::error::expected system bash 3.2 on macOS but got $ver — the shim did not take effect"; exit 1;;
            esac
          fi

      # Core regression: on a clean runner there are no *.env profiles (only
      # the generated *.env.example files), so `desired_aliases` is empty.
      # Before the fix this aborted here with "unbound variable" on bash 3.2.
      - name: install.sh (empty-profile path)
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          ./install.sh

          aidc_bin="$HOME/.local/bin/aidc"
          [ -L "$aidc_bin" ] || fail "expected symlink at $aidc_bin"
          target="$(readlink "$aidc_bin")"
          case "$target" in
            *"/bin/aidc") echo "symlink -> $target";;
            *) fail "symlink points at unexpected target: $target";;
          esac

          prof_dir="$HOME/.config/aidc/providers/claude"
          [ -f "$prof_dir/zai.env.example" ] || fail "profile examples were not seeded in $prof_dir"

          # Make the freshly installed CLI available to later steps.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "install.sh OK"

      - name: Docker-free command smoke test
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          aidc help >/dev/null || fail "aidc help failed"

          out="$(aidc version)" || fail "aidc version exited non-zero"
          echo "$out" | grep -Eq '^aidc [0-9]+\.[0-9]+\.[0-9]+' \
            || fail "unexpected aidc version output: $out"

          # doctor must always produce a well-formed report; exit 1 is
          # legitimate when the runner lacks docker (macOS) — a crash is not.
          rc=0
          out="$(aidc doctor)" || rc=$?
          [ "$rc" -le 1 ] || fail "aidc doctor crashed (rc=$rc): $out"
          echo "$out" | grep -q '^host' || fail "doctor output malformed: $out"

          # No profiles yet -> must exit 0 (empty-array path again).
          out="$(aidc claude --list-profiles)" || fail "--list-profiles exited non-zero"
          echo "$out" | grep -q "no Claude profiles found" \
            || fail "unexpected --list-profiles output: $out"

          # Idempotent re-sync with no profiles must also stay clean.
          aidc sync-claude-aliases >/dev/null || fail "sync-claude-aliases (empty) failed"

          # status outside any project should report cleanly, not crash.
          ( cd "$RUNNER_TEMP" && aidc status >/dev/null ) || fail "aidc status failed outside a project"
          echo "smoke OK"

      - name: Claude profile alias lifecycle (non-empty + stale-removal paths)
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          prof_dir="$HOME/.config/aidc/providers/claude"
          alias_bin="$HOME/.local/bin/claude-ci"
          mkdir -p "$prof_dir"

          cat > "$prof_dir/ci.env" <<'EOF'
          AIDC_CLAUDE_DESCRIPTION="CI test profile"
          ANTHROPIC_AUTH_TOKEN="dummy-token"
          ANTHROPIC_BASE_URL="https://example.invalid"
          EOF
          chmod 600 "$prof_dir/ci.env"

          # Sync should materialize a managed wrapper for the new profile.
          aidc sync-claude-aliases >/dev/null || fail "sync with a profile failed"
          [ -x "$alias_bin" ] || fail "expected executable alias at $alias_bin"
          grep -q 'exec aidc claude --profile ci' "$alias_bin" \
            || fail "alias wrapper does not invoke the ci profile"

          aidc claude --list-profiles | grep -q 'claude-ci' \
            || fail "ci profile not shown in --list-profiles"

          # Remove the profile and re-sync: the managed alias must be pruned.
          # This drives the empty-desired-aliases branch *with* an existing
          # managed alias present (the array_contains guard).
          rm -f "$prof_dir/ci.env"
          aidc sync-claude-aliases >/dev/null || fail "stale-removal sync failed"
          [ ! -e "$alias_bin" ] || fail "stale alias $alias_bin was not removed"
          echo "alias lifecycle OK"

      - name: Toolchain detection under set -u
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          lib="$GITHUB_WORKSPACE/lib/aidc.sh"

          empty="$RUNNER_TEMP/proj-empty"
          mkdir -p "$empty"
          # No marker files -> empty result. Run under `bash -u` so the empty
          # array expansion in detect_toolchains is actually exercised.
          out="$(bash -u -c 'source "$1"; aidc::detect_toolchains "$2"' _ "$lib" "$empty")" \
            || fail "detect_toolchains crashed on a project with no toolchains"
          [ -z "$out" ] || fail "expected empty toolchain list, got: '$out'"

          go="$RUNNER_TEMP/proj-go"
          mkdir -p "$go"
          printf 'module example.com/x\n' > "$go/go.mod"
          out="$(bash -u -c 'source "$1"; aidc::detect_toolchains "$2"' _ "$lib" "$go")" \
            || fail "detect_toolchains crashed on a go project"
          [ "$out" = "go" ] || fail "expected 'go', got: '$out'"
          echo "toolchain detection OK"

      # Full scaffold. `aidc init` only needs the Docker *CLI* present (a
      # binary presence check), not a running daemon. ubuntu-latest ships it;
      # macOS runners do not, so this skips cleanly there.
      - name: aidc init scaffold (requires docker CLI)
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          if ! command -v docker >/dev/null 2>&1; then
            echo "docker CLI not present on ${{ runner.os }} — skipping init scaffold test"
            exit 0
          fi

          work="$RUNNER_TEMP/scaffold-proj"
          rm -rf "$work"
          mkdir -p "$work"
          git -C "$work" init -q

          ( cd "$work" && aidc init ) || fail "aidc init failed"

          for f in \
            .devcontainer/Dockerfile \
            .devcontainer/compose.yaml \
            .devcontainer/compose.firewall.yaml \
            .devcontainer/compose.hardened.yaml \
            .devcontainer/devcontainer.json \
            .devcontainer/scripts/bootstrap-state.sh \
            .devcontainer/scripts/init-firewall.sh \
            .ai-container/project.env \
            CLAUDE.md \
            AGENTS.md \
            CHANGELOG.md \
            DETAILED_CHANGELOG.md \
            logs/README.md \
            .cursor/rules/00-core-logics.mdc; do
            [ -f "$work/$f" ] || fail "init did not create $f"
          done

          grep -q '^AIDC_REPO_SLUG=' "$work/.ai-container/project.env" \
            || fail "project.env missing AIDC_REPO_SLUG"

          # Documentation seeds are copy-once: a hand-edit must survive re-init.
          echo "EDITED-BY-USER" >> "$work/CHANGELOG.md"
          ( cd "$work" && aidc init ) || fail "second aidc init failed"
          grep -q 'EDITED-BY-USER' "$work/CHANGELOG.md" \
            || fail "re-init clobbered a user edit to CHANGELOG.md"

          # Re-running init over an initialized repo must be a clean no-op.
          ( cd "$work" && aidc init ) || fail "second aidc init was not idempotent"
          echo "init scaffold OK"

      # Syntax/structure validation of everything init scaffolded: shell
      # parses + shellcheck, project.env sources under set -u, JSON is valid,
      # compose renders, Dockerfile lints. Docker-dependent checks skip where
      # no docker is available (macOS runners).
      - name: Validate scaffold output
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/scaffold-proj"
          if [ ! -d "$work" ]; then
            echo "scaffold dir absent (init skipped on this runner) — skipping"
            exit 0
          fi
          .github/scripts/validate-scaffold.sh "$work"

      # Upgrade round-trip: a local edit to a managed file is preserved by the
      # implicit scaffold path, shown by `upgrade --dry-run`, and restored by
      # `upgrade -y` with a backup.
      - name: aidc upgrade round-trip (requires docker CLI)
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          work="$RUNNER_TEMP/scaffold-proj"
          if [ ! -d "$work" ]; then
            echo "scaffold dir absent — skipping"
            exit 0
          fi
          cd "$work"
          printf '\n# E2E-LOCAL-EDIT\n' >> .devcontainer/Dockerfile

          out="$(aidc upgrade --dry-run)" || fail "upgrade --dry-run failed"
          echo "$out" | grep -q 'update: .devcontainer/Dockerfile' \
            || fail "dry-run did not list the edited Dockerfile"
          grep -q 'E2E-LOCAL-EDIT' .devcontainer/Dockerfile \
            || fail "dry-run modified the Dockerfile"

          aidc upgrade -y || fail "upgrade -y failed"
          if grep -q 'E2E-LOCAL-EDIT' .devcontainer/Dockerfile; then
            fail "upgrade -y did not restore the Dockerfile"
          fi
          backup="$(find .ai-container/backup -name Dockerfile | head -1)"
          [ -n "$backup" ] && grep -q 'E2E-LOCAL-EDIT' "$backup" \
            || fail "backup with the local edit missing"

          out="$(aidc upgrade)" || fail "post-upgrade check failed"
          echo "$out" | grep -q 'already current' \
            || fail "upgrade not idempotent: $out"
          echo "upgrade round-trip OK"

      # The security posture of the rendered compose config must match the
      # knobs: default = docker-default caps + pids cap, no extra grants;
      # firewall override = NET_ADMIN/NET_RAW; hardened override =
      # no-new-privileges.
      - name: Compose hardening posture (requires docker compose)
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          work="$RUNNER_TEMP/scaffold-proj"
          if [ ! -d "$work" ] || ! docker compose version >/dev/null 2>&1; then
            echo "docker compose not available — skipping"
            exit 0
          fi
          cd "$work"
          stub="$RUNNER_TEMP/compose-stub"
          mkdir -p "$stub"
          for v in $(grep -o '\${AIDC_[A-Z_]*' .devcontainer/compose.yaml | sed 's/^\${//' | sort -u); do
            export "$v=$stub"
          done
          export COMPOSE_PROJECT_NAME=aidc_posture
          base=.devcontainer/compose.yaml

          cfg="$(docker compose -f "$base" config)"
          if printf '%s' "$cfg" | grep -q 'NET_ADMIN'; then
            fail "default config grants NET_ADMIN"
          fi
          if printf '%s' "$cfg" | grep -q 'no-new-privileges'; then
            fail "default config sets no-new-privileges"
          fi
          if ! printf '%s' "$cfg" | grep -q 'pids_limit'; then
            fail "default config is missing the pids_limit fork-bomb guard"
          fi

          cfg="$(docker compose -f "$base" -f .devcontainer/compose.firewall.yaml config)"
          if ! printf '%s' "$cfg" | grep -q 'NET_ADMIN'; then
            fail "firewall override does not grant NET_ADMIN"
          fi

          cfg="$(docker compose -f "$base" -f .devcontainer/compose.hardened.yaml config)"
          if ! printf '%s' "$cfg" | grep -q 'no-new-privileges'; then
            fail "hardened override does not set no-new-privileges"
          fi
          echo "hardening posture OK"

      # Destructive lifecycle: destroy with both purge flags must remove every
      # managed path (and nothing user-owned), leave no docker volumes behind,
      # and a re-init must reproduce the managed scaffold byte-for-byte.
      - name: Destroy → re-init lifecycle (requires docker daemon)
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          work="$RUNNER_TEMP/scaffold-proj"
          if [ ! -d "$work" ] || ! docker info >/dev/null 2>&1; then
            echo "docker daemon not available — skipping lifecycle test"
            exit 0
          fi

          # Snapshot the managed scaffold for the re-init comparison.
          snapshot="$RUNNER_TEMP/scaffold-before"
          rm -rf "$snapshot"
          mkdir -p "$snapshot"
          ( cd "$work" && tar -cf - .devcontainer .ai-container scripts/ci .cursor ) \
            | tar -xf - -C "$snapshot"

          ( cd "$work" && aidc destroy -f --purge-scaffold --purge-worktree ) \
            || fail "aidc destroy failed"

          # Managed paths must be gone...
          for f in \
            .devcontainer \
            .ai-container \
            .cursor/rules/00-core-logics.mdc \
            scripts/ci/sbom-all.sh \
            scripts/ci/license-check.sh; do
            [ ! -e "$work/$f" ] || fail "destroy --purge-scaffold left $f behind"
          done
          # ...user-owned seeded docs must survive...
          for f in CHANGELOG.md DETAILED_CHANGELOG.md logs/README.md; do
            [ -f "$work/$f" ] || fail "destroy removed user-owned $f"
          done
          # ...and the aidc-managed block must be stripped from merged files.
          if grep -q 'aidc:core-logics:start' "$work/CLAUDE.md" 2>/dev/null; then
            fail "CLAUDE.md still contains the aidc-managed block after destroy"
          fi
          # No leftover named volumes for this project.
          if docker volume ls -q | grep -q '^aidc_scaffold-proj'; then
            fail "leftover docker volumes after destroy"
          fi

          # Re-init must reproduce the managed scaffold identically.
          ( cd "$work" && aidc init ) || fail "re-init after destroy failed"
          for d in .devcontainer .ai-container scripts/ci .cursor; do
            diff -r "$snapshot/$d" "$work/$d" \
              || fail "re-init produced a different $d than the first init"
          done
          echo "lifecycle OK"
