name: shellcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          # Every *.sh in the repo plus the bin/aidc launcher (no extension).
          # .sh.tmpl files are bash with mustache-style placeholders that
          # shellcheck can't parse, so they're excluded by the glob.
          targets=(bin/aidc)
          while IFS= read -r -d '' f; do
            targets+=("$f")
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

          shellcheck --severity=warning "${targets[@]}"

      - name: Syntax-check Python clipboard server
        run: python3 -m py_compile bin/aidc-clipboard-server

      - name: Run bootstrap unit tests
        run: .github/scripts/test-bootstrap-state.sh

      - name: Run SBOM + license unit tests
        run: |
          set -euo pipefail
          bash tests/license-resolve.test.sh
          bash tests/license-check.test.sh
          bash tests/sbom-diff.test.sh

      - name: Run scaffold-validator unit tests
        run: bash tests/validate-scaffold.test.sh

      - name: Run supply-chain pin unit tests
        run: |
          set -euo pipefail
          bash tests/update-pins.test.sh
          bash tests/check-image-pins.test.sh

      - name: Run compose file-chain unit tests
        run: bash tests/compose-file-args.test.sh

      - name: Run firewall unit tests
        run: bash tests/init-firewall.test.sh

      - name: Run token-delivery unit tests
        run: bash tests/token-delivery.test.sh

      - name: Run doctor + update unit tests
        run: |
          set -euo pipefail
          bash tests/doctor.test.sh
          bash tests/update.test.sh

      - name: Run upgrade unit tests
        run: bash tests/upgrade.test.sh

      - name: Run aidc-scan unit tests
        run: bash tests/aidc-scan.test.sh

      - name: Run CLI polish unit tests
        run: bash tests/cli-errors.test.sh

      - name: Run session-sync unit tests
        run: bash tests/sync-sessions.test.sh

      - name: Run build/agent-selection unit tests
        run: |
          set -euo pipefail
          bash tests/compose-up.test.sh
          bash tests/agents-opt-in.test.sh

      - name: Run image-split + toolchain-volume unit tests
        run: bash tests/toolchain-volume.test.sh

      - name: Check lib module layering
        run: .github/scripts/check-module-deps.sh

      - name: Run scan-hook + insights unit tests
        run: |
          set -euo pipefail
          bash tests/scan-hook.test.sh
          bash tests/insights.test.sh
